<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../../tokens.css">
  <link rel="stylesheet" href="../bundle.css">
  <link rel="stylesheet" href="../preview.css">
  <title>Assistant badge — WSurf Design System</title>
</head>
<body class="ws-preview">
  <main>
    <div class="ws-preview-row">
      <span class="ws-assistant-badge app-control" data-state="thinking"><span class="ws-assistant-dot" aria-hidden="true"></span>Thinking</span>
      <span class="ws-assistant-badge app-control" data-state="acting"><span class="ws-assistant-dot" aria-hidden="true"></span>Reading 2 tabs</span>
      <span class="ws-assistant-badge app-control" data-state="paused"><span class="ws-assistant-dot" aria-hidden="true"></span>Waiting for you</span>
    </div>
  </main>
</body>
</html>
