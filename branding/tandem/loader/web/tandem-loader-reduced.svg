<svg xmlns="http://www.w3.org/2000/svg" viewBox="-672 -672 1344 1344" role="img" aria-label="Loading"><title>Loading</title><style>.tl-lead{fill:#3B1FD1}.tl-follower{fill:#14C79A}.tl-ring{fill:#F5F5F7}
